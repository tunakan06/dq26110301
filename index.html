<title>キリノシマ物語</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* レイアウト：上にゲーム画面（正方形）、下に携帯ゲーム機風のコントローラー */
:root {
  --night: #0b1020;      /* 外枠 */
  --shell: #1a2238;      /* 本体 */
  --ink: #f2efe6;        /* 文字・枠線 */
  --win: #0a0c18;        /* ウィンドウ地 */
  --gold: #e8c35a;       /* 強調 */
  --sea: #3a7bd5;        /* ボタン */
  --pixel: "DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--pixel);
  overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
#app {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding-block: 10px 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; gap: 10px;
  --S: min(calc(100vw - 32px), calc(100vh - 250px), 560px);
  --S: min(calc(100vw - 32px), calc(100dvh - 250px), 560px);
}
#screen {
  position: relative; width: var(--S); height: var(--S); flex: none;
  border: 3px solid #2b3555; border-radius: 6px; overflow: hidden; background: #000;
  box-shadow: 0 0 0 4px #0e1426, 0 10px 30px rgba(0,0,0,.6);
  font-size: calc(var(--S) / 24.5);
}
#cv { width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
#layer { position: absolute; inset: 0; pointer-events: none; }
#layer > * { pointer-events: auto; }

.win {
  position: absolute; background: var(--win); border: 0.18em solid var(--ink); border-radius: 0.35em;
  box-shadow: 0 0 0 0.12em var(--win); padding: 0.45em 0.6em; line-height: 1.45; box-sizing: border-box;
}
.wtitle { font-size: .85em; color: var(--gold); margin: -0.1em 0 0.2em; letter-spacing: .05em; }
.menu { max-height: 76%; overflow-y: auto; }
.mlist { display: grid; gap: 0.05em 0.6em; }
.mi {
  all: unset; display: flex; justify-content: space-between; gap: .6em; padding: 0.12em 0 0.12em 1em; position: relative; cursor: pointer;
  color: var(--ink); font-family: var(--pixel); font-size: 1em; white-space: nowrap;
}
.mi.cur::before { content: "▶"; position: absolute; left: 0; font-size: .8em; top: .3em; animation: blink .8s steps(2) infinite; }
.mi.dis { opacity: .4; }
.mi .r { color: #c9c4b4; font-variant-numeric: tabular-nums; }
.mi:focus-visible { outline: 1px dashed var(--gold); }

#msg { left: 3%; right: 3%; bottom: 3%; min-height: 30%; }
#msgtext { white-space: pre-wrap; margin: 0; font-size: 1em; }
#msgnext { position: absolute; left: 50%; bottom: .2em; transform: translateX(-50%); animation: blink .8s steps(2) infinite; font-size: .8em; }
#status { top: 3%; left: 3%; right: 3%; display: flex; gap: 2%; padding: 0; background: none; border: none; box-shadow: none; }
#status .pm {
  flex: 0 1 32%; background: var(--win); border: 0.15em solid var(--ink); border-radius: 0.3em; padding: 0.25em 0.45em; line-height: 1.3;
  font-variant-numeric: tabular-nums; font-size: .9em;
}
#status .pm b { font-weight: normal; margin-left: .3em; }
#status .pm .nm { color: var(--gold); display: flex; justify-content: space-between; align-items: baseline; gap: .3em; }
#status .pm .hm { display: flex; justify-content: space-between; gap: .4em; }
#status .pm.low { color: #ffb347; border-color: #ffb347; }
#status .pm.dead { color: #ff6b6b; border-color: #ff6b6b; }
#status .pm.act { transform: translateY(0.25em); box-shadow: 0 0 0 .12em var(--gold); }
#status .pm .lv { font-size: .8em; color: #c9c4b4; }
#gold { right: 3%; bottom: 36%; font-variant-numeric: tabular-nums; color: var(--gold); }
#help { left: 3%; right: 3%; bottom: 3%; font-size: .9em; }

#title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding-top: 16%; pointer-events: none; text-align: center; }
#title h1 { margin: 0; font-weight: normal; font-size: 2.3em; letter-spacing: .12em; color: var(--ink); text-shadow: 0 .12em 0 #0d2747, 0 0 .6em rgba(232,195,90,.6); text-wrap: balance; }
#title p { margin: .3em 0 0; font-size: .85em; color: var(--gold); letter-spacing: .3em; }
#ending { position: absolute; inset: 0; background: radial-gradient(circle at 50% 40%, #2a4f7a, #0b1020 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8em; text-align: center; padding: 8%; line-height: 1.7; }
#ending h2 { font-weight: normal; color: var(--gold); margin: 0; font-size: 1.6em; letter-spacing: .1em; }
#ending p { margin: 0; }
#fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .25s; }
#fade.on { opacity: 1; }
#screen.flash::after { content: ""; position: absolute; inset: 0; background: #fff; animation: flash .45s ease-out; pointer-events: none; }
#screen.enc #cv { animation: enc .45s steps(6); }
@keyframes flash { from { opacity: .85 } to { opacity: 0 } }
@keyframes enc { 0%,33%,66% { filter: invert(1) } 16%,50%,83%,100% { filter: none } }
@keyframes blink { 50% { opacity: 0 } }

/* コントローラー */
#pad { width: var(--S); min-width: 280px; max-width: 100%; flex: 1; max-height: 230px; display: flex; align-items: center; justify-content: space-between; }
.dpad { display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); width: min(42vw, 170px); aspect-ratio: 1; max-width: 100%; }
.dpad button, .ab button { all: unset; touch-action: none; cursor: pointer; }
.dpad button { background: #2b3555; box-shadow: inset 0 -4px 0 #151b2e; display: grid; place-items: center; color: #8d97b8; font-size: 18px; }
.dpad button.on { background: #3a4670; box-shadow: inset 0 2px 0 #151b2e; color: var(--ink); }
.dpad .u { grid-area: 1/2; border-radius: 8px 8px 0 0; } .dpad .l { grid-area: 2/1; border-radius: 8px 0 0 8px; }
.dpad .r { grid-area: 2/3; border-radius: 0 8px 8px 0; } .dpad .d { grid-area: 3/2; border-radius: 0 0 8px 8px; }
.dpad .c { grid-area: 2/2; background: #2b3555; }
.ab { display: flex; gap: 14px; align-items: center; transform: rotate(-18deg); }
.ab button { width: min(17vw, 72px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 20px; color: #fff; box-shadow: inset 0 -5px 0 rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.4); }
.ab .a { background: var(--sea); transform: translateY(-22px); }
.ab .b { background: #b0473a; }
.ab button.on { filter: brightness(1.25); box-shadow: inset 0 2px 0 rgba(0,0,0,.35); }
.ab span { display: block; font-size: 10px; opacity: .8; margin-top: -4px; }
@media (prefers-reduced-motion: reduce) { .mi.cur::before, #msgnext { animation: none; } #screen.enc #cv { animation: none; } }
</style>

<div id="app">
  <div id="screen">
    <canvas id="cv" width="176" height="176"></canvas>
    <div id="title">
      <h1>キリノシマ物語</h1>
      <p>— きりに きえた しまじま —</p>
    </div>
    <div id="status" class="win" hidden></div>
    <div id="gold" class="win" hidden></div>
    <div id="help" class="win" hidden></div>
    <div id="msg" class="win" hidden><pre id="msgtext"></pre><div id="msgnext" hidden>▼</div></div>
    <div id="layer"></div>
    <div id="ending" hidden>
      <h2>きりは はれた</h2>
      <p>うみの むこうに しまじまが もどり<br>ふねが ゆききする ひびが かえってきた。</p>
      <p id="endstats"></p>
      <p>おしまい<br><small>Aボタンで タイトルへ</small></p>
    </div>
    <div id="fade"></div>
  </div>
  <div id="pad">
    <div class="dpad">
      <button class="u" data-key="up" aria-label="うえ">▲</button>
      <button class="l" data-key="left" aria-label="ひだり">◀</button>
      <div class="c"></div>
      <button class="r" data-key="right" aria-label="みぎ">▶</button>
      <button class="d" data-key="down" aria-label="した">▼</button>
    </div>
    <div class="ab">
      <button class="b" data-key="b" aria-label="Bボタン（メニュー・もどる）"><div>B<span>メニュー</span></div></button>
      <button class="a" data-key="a" aria-label="Aボタン（けってい・はなす）"><div>A<span>けってい</span></div></button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/field.js"></script>
<script src="js/battle.js"></script>
<script src="js/main.js"></script>
